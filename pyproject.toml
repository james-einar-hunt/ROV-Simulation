[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rov-sim"
version = "0.1.0"
description = "Forward simulation of an ROV."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
